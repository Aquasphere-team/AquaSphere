<!DOCTYPE html>
<html>
<head>
    <title>FISH TEST - DIREKT</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #222;
            font-family: Arial;
            color: white;
        }
        #canvas {
            border: 2px solid white;
            display: block;
            margin: 20px auto;
        }
        .info {
            text-align: center;
            font-size: 20px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">🐠 FISH TEST - Funktioniert das?</h1>
    <div class="info" id="info">Initialisiere...</div>
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Test: Rotes Rechteck
        ctx.fillStyle = 'red';
        ctx.fillRect(10, 10, 50, 50);
        
        // Fische erstellen
        const fish = [
            { x: 200, y: 300, color: '#FFD700', size: 25, speedX: 2, speedY: 1, name: 'Goldie' },
            { x: 500, y: 200, color: '#4169E1', size: 20, speedX: -2, speedY: 0.5, name: 'Blinky' },
            { x: 350, y: 450, color: '#DC143C', size: 18, speedX: 1, speedY: -1, name: 'Ruby' }
        ];
        
        document.getElementById('info').textContent = `${fish.length} Fische geladen`;
        
        function drawFish(f) {
            ctx.save();
            ctx.translate(f.x, f.y);
            
            // Körper
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, f.size * 0.8, f.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Schwanz
            ctx.beginPath();
            ctx.moveTo(-f.size * 0.8, 0);
            ctx.lineTo(-f.size * 1.3, -f.size * 0.3);
            ctx.lineTo(-f.size * 1.3, f.size * 0.3);
            ctx.closePath();
            ctx.fill();
            
            // Auge
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(f.size * 0.3, -f.size * 0.15, f.size * 0.15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(f.size * 0.35, -f.size * 0.15, f.size * 0.08, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function animate() {
            // Wasser-Hintergrund
            ctx.fillStyle = '#1e5a8a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Bewege und zeichne Fische
            fish.forEach(f => {
                f.x += f.speedX;
                f.y += f.speedY;
                
                // Grenzen
                if (f.x < 0 || f.x > canvas.width) f.speedX *= -1;
                if (f.y < 0 || f.y > canvas.height) f.speedY *= -1;
                
                drawFish(f);
                
                // Name
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.fillText(f.name, f.x - 20, f.y - f.size - 5);
            });
            
            requestAnimationFrame(animate);
        }
        
        console.log('🐠 Starting animation with', fish.length, 'fish');
        animate();
    </script>
</body>
</html>
