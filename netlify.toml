[build]
  # Build from the `aquasphere` subfolder and publish the Angular output
  command = "npm ci --prefix aquasphere && npm run build --prefix aquasphere"
  publish = "aquasphere/dist/aquasphere"

# Redirect all routes to index.html so the Angular router can handle client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

